
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [principal]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          unzip APOSTA-CIRURGICA-projeto-inicial.zip
          cd APOSTA-CIRURGICA
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: APOSTA-CIRURGICA-APK
          path: APOSTA-CIRURGICA/app/build/outputs/apk/debug/app-debug.apk
